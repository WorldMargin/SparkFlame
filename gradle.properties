android.useAndroidX=true
android.overridePathCheck=true
kotlin.compiler.execution.strategy=in-process

# ============================================================
# 模块标识：构建时注入成 BuildConfig，代码里不写死。
# fork 之后只改这一段，不用在源码里全局替换包名。
# ============================================================

# 模块自己的 applicationId（同时用于 ContentProvider authority、广播定向、跨包查询）
spark.modulePackage=io.github.worldmargin.sparkflame

# 宿主要注入的包名（抖音）
spark.hostPackage=com.ss.android.ugc.aweme

# 改包提示里展示的维护者与仓库
spark.maintainer=WorldMargin
spark.repoUrl=https://gitee.com/WorldMargin/SparkFlame

# 期望的签名证书 SHA-256（hex，可逗号分隔多个，用于换签名过渡）。
# 留空 = 构建时从 release-signing.properties 指向的 keystore 现算，
# 换 keystore 重新构建即可，不需要手抄指纹。
# 注意：没有 release-signing.properties 的构建算不出指纹，签名闸门会跳过（仅开发自用）。
spark.signatureSha256=
