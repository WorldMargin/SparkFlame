<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>文案脚本</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background: #ffffff;
        }

        #editor {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }

        /* 移动端：补全面板与悬浮提示不要被裁掉 */
        .monaco-editor .suggest-widget,
        .monaco-editor .parameter-hints-widget,
        .monaco-editor .monaco-hover {
            z-index: 100;
        }
    </style>
</head>
<body>
<div id="editor"></div>
<script src="vs/loader.js"></script>
<script src="spark.js"></script>
</body>
</html>
